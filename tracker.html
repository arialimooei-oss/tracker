<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Lalezar&family=Noto+Sans+Runic&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f1f1c;--mut:#807e76;--line:#e3e1d9;--ac:#1d6b57;--dn:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171715;--card:#222220;--tx:#f0efe9;--mut:#9a988f;--line:#38372f;--ac:#4cc3a0;--dn:#e07a68;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171715;--card:#222220;--tx:#f0efe9;--mut:#9a988f;--line:#38372f;--ac:#4cc3a0;--dn:#e07a68;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;padding:16px;max-width:640px;margin-inline:auto}
h1{font-size:20px;margin:8px 0 14px}
h2{font-size:15px;margin:22px 0 8px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.add{display:flex;gap:8px;margin-bottom:12px}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
#job{flex:2}#cost{flex:1}
button{font:inherit;border:0;border-radius:10px;background:var(--ac);color:#fff;padding:10px 16px;cursor:pointer}
.x{background:none;color:var(--mut);padding:4px 8px;font-size:18px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.c,th.c{width:96px;white-space:nowrap}
td.k,th.k{width:56px;text-align:center}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);padding:0}
.done td.j,.done td.c{text-decoration:line-through;color:var(--mut)}
.tot{display:flex;justify-content:space-between;padding:12px 14px;font-weight:600}
.empty{padding:16px;text-align:center;color:var(--mut);font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.bx{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.wr{position:relative;display:flex;gap:8px;height:132px}
.wh{flex:1 1 0;min-width:0;height:132px;overflow-y:auto;padding:44px 0;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wh::-webkit-scrollbar{display:none}
.wi{height:44px;line-height:44px;text-align:center;font-size:17px;scroll-snap-align:center;white-space:nowrap}
.hl{position:absolute;left:0;right:0;top:44px;height:44px;border-top:1px solid var(--mut);border-bottom:1px solid var(--mut);pointer-events:none}
.bt{display:flex;gap:8px;margin-top:14px}.bt button{flex:1}
.bt .cn{background:none;border:1px solid var(--line);color:var(--tx)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tb{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--line);padding:8px 14px;border-radius:20px}
.tb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.te{display:flex;gap:6px;margin-bottom:12px}.te input{flex:1;min-width:0}
:root{--bg:#f5ecdf;--card:#fffaf1;--tx:#2d2219;--mut:#957f69;--line:#ecdfca;--ac:#d9622b;--dn:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#2a221b;--tx:#f4eadb;--mut:#aa957d;--line:#3d3329;--ac:#f08a4b;--dn:#ef7f6c}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#2a221b;--tx:#f4eadb;--mut:#aa957d;--line:#3d3329;--ac:#f08a4b;--dn:#ef7f6c}
body{background:var(--bg);font-weight:400;line-height:1.6;padding:18px 16px 40px}
h1{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:32px;margin:10px 0 16px;color:var(--ac);letter-spacing:0}
h1::before{content:'\1F9F0  ';font-size:26px}
h2{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:20px;color:var(--tx);margin:26px 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px rgba(90,55,20,.09)}
input{border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font-size:15px;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--ac)}
button{border-radius:14px;font-weight:600;padding:11px 18px;box-shadow:0 3px 10px rgba(217,98,43,.28)}
button:active{transform:scale(.97)}
.x,.bt .cn{box-shadow:none}
.tb{border-radius:999px;font-weight:600;box-shadow:none;padding:9px 16px;border:1.5px solid var(--line)}
.tb.on{box-shadow:0 4px 12px rgba(217,98,43,.35)}
th{font-size:12px;letter-spacing:0;padding:12px 14px 8px;border-bottom:1.5px dashed var(--line)}
td{padding:13px 14px;border-bottom:1px dashed var(--line);font-size:15px}
td.c{font-weight:600;font-size:16px}
td.j{font-weight:600}
.done td.j,.done td.c{opacity:.55;text-decoration-thickness:2px;text-decoration-color:var(--ac)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--ac);border-radius:8px}
.tot{background:rgba(217,98,43,.09);padding:14px 16px;font-size:14px;color:var(--mut)}
.tot span:last-child{font-family:Lalezar,Vazirmatn,sans-serif;font-size:22px;color:var(--ac);font-weight:400}
.empty{padding:22px 16px}
.hl{border-color:var(--ac)}
.bx{border-radius:24px 24px 0 0}
:root{--bg:#e6dcc6;--card:#f2ead8;--tx:#2a251d;--mut:#7a6e5b;--line:#cbbd9f;--ac:#8e2f22;--dn:#a3281c;--gold:#8f6f2c;--sh:rgba(60,45,20,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171a;--card:#1c2327;--tx:#e7e2d6;--mut:#8a958f;--line:#30393e;--ac:#b5472f;--dn:#d9644f;--gold:#c9a35b;--sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#12171a;--card:#1c2327;--tx:#e7e2d6;--mut:#8a958f;--line:#30393e;--ac:#b5472f;--dn:#d9644f;--gold:#c9a35b;--sh:rgba(0,0,0,.5)}
body{background:radial-gradient(900px 420px at 50% -80px,rgba(130,160,180,.20),transparent 70%),var(--bg);background-attachment:fixed}
h1{font-size:30px;color:var(--tx);margin:12px 0 18px;line-height:1.3}
h1::before{content:'\16DE  ';font-family:'Noto Sans Runic',sans-serif;font-size:24px;color:var(--gold)}
h1::after{content:'\16A0 \16A2 \16A6 \16A8 \16B1 \16B2';display:block;font-family:'Noto Sans Runic',sans-serif;font-size:13px;letter-spacing:8px;color:var(--gold);opacity:.75;margin-top:4px;direction:ltr;text-align:right}
h2{color:var(--gold);font-size:19px}
h2::before{content:'\16DF  ';font-family:'Noto Sans Runic',sans-serif;font-size:15px;opacity:.8}
.card{border-radius:8px;border:1px solid var(--line);box-shadow:0 10px 28px var(--sh),inset 0 0 0 1px rgba(201,163,91,.10)}
input,select{border-radius:6px;background:var(--card);border-width:1px}
button{border-radius:6px;color:#f5ecd9;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.x,.bt .cn{box-shadow:none}
.tb{border-radius:4px;background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.tb.on{background:var(--ac);color:#f5ecd9;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
th{color:var(--gold);border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
.done td.j,.done td.c{opacity:.5;text-decoration-color:var(--ac)}
.tot{background:rgba(181,71,47,.13);color:var(--mut)}
.tot span:last-child{color:var(--gold)}
.hl{border-color:var(--gold)}
.bx{border-radius:12px 12px 0 0;border-top:1px solid var(--gold)}
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#0b141a;--card:rgba(17,30,38,.80);--tx:#ebe4d5;--mut:#8fa1a8;--line:rgba(120,165,180,.22);--ac:#e2692a;--dn:#ef7a63;--gold:#f2a65a;--sh:rgba(0,0,0,.6);color-scheme:dark}
body{background:radial-gradient(520px 360px at 50% 100%,rgba(226,105,42,.40),transparent 70%),radial-gradient(760px 420px at 50% 114%,rgba(255,170,80,.20),transparent 70%),radial-gradient(700px 360px at 30% -60px,rgba(120,165,185,.16),transparent 70%),repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.32) 46px 74px,transparent 74px 150px),linear-gradient(180deg,#0b141a 0%,#12252d 55%,#0a1217 100%);background-attachment:fixed;color:var(--tx)}
body>*{position:relative;z-index:1}
.card{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 10px 30px var(--sh),0 0 26px rgba(226,105,42,.07)}
.tot{background:rgba(226,105,42,.12)}
.tb.on{box-shadow:0 0 14px rgba(226,105,42,.55)}
button{box-shadow:0 2px 10px rgba(226,105,42,.35)}
.x,.bt .cn{box-shadow:none}
.bx{background:#13222b}
.em{position:fixed;bottom:-10px;border-radius:50%;background:#ffb25a;box-shadow:0 0 8px 2px rgba(255,140,50,.8);opacity:0;pointer-events:none;z-index:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:.9}100%{transform:translate(var(--dx),-100vh) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.em{display:none}}
</style>
</head>
<body>
<h1>جدول کار و هزینه</h1>
<div id="tabs"></div><div id="tabEdit"></div>
<div class="add">
  <input id="job" placeholder="کاری که انجام دادم">
  <input id="cost" placeholder="هزینه (اختیاری)" inputmode="decimal">
  <button id="addb">افزودن</button>
</div>

<div class="card">
  <table>
    <thead><tr><th>کار</th><th class="c">هزینه</th><th class="k">تسویه</th></tr></thead>
    <tbody id="open"></tbody>
  </table>
  <div class="tot"><span>جمع تسویه‌نشده</span><span id="tOpen">۰</span></div>
</div>

<h2>تسویه‌شده‌ها</h2>
<div class="card">
  <table><tbody id="done"></tbody></table>
  <div class="tot"><span>جمع تسویه‌شده</span><span id="tDone">۰</span></div>
</div>

<script>
var data=null;
try{data=JSON.parse(localStorage.getItem('jobcost2')||'null')}catch(e){data=null}
if(!data){var old=[];try{old=JSON.parse(localStorage.getItem('jobcost')||'[]')}catch(e){old=[]}
  data={tabs:[{id:1,name:'تراشکاری',items:old},{id:2,name:'کار در لبنیاتی',items:[]}],cur:1}}
function curTab(){for(var i=0;i<data.tabs.length;i++)if(data.tabs[i].id===data.cur)return data.tabs[i];return data.tabs[0]}
var items=curTab().items;
function save(){try{localStorage.setItem('jobcost2',JSON.stringify(data))}catch(e){}}
var editMode=null;
function setCur(id){data.cur=id;items=curTab().items;editMode=null;save();renderAll()}
function renderTabs(){var t=document.getElementById('tabs');t.innerHTML='';t.className='tabs';
  data.tabs.forEach(function(tb){var b=document.createElement('button');var on=tb.id===curTab().id;b.className='tb'+(on?' on':'');b.textContent=tb.name+(on?' ✎':'');
    b.onclick=function(){if(on){editMode=editMode==='edit'?null:'edit';renderTabs()}else setCur(tb.id)};t.appendChild(b)});
  var p=document.createElement('button');p.className='tb';p.textContent='+ کار جدید';p.onclick=function(){editMode=editMode==='new'?null:'new';renderTabs()};t.appendChild(p);
  var e=document.getElementById('tabEdit');e.innerHTML='';e.className='';
  if(editMode){e.className='te';var inp=document.createElement('input');inp.placeholder='اسم کار (مثلاً تراشکاری)';if(editMode==='edit')inp.value=curTab().name;
    var ok=document.createElement('button');ok.textContent='ذخیره';
    var go=function(){var v=inp.value.trim();if(!v)return;if(editMode==='new'){var id=Date.now();data.tabs.push({id:id,name:v,items:[]});setCur(id)}else{curTab().name=v;editMode=null;save();renderTabs()}};
    ok.onclick=go;inp.onkeydown=function(ev){if(ev.key==='Enter')go()};
    e.appendChild(inp);e.appendChild(ok);
    if(editMode==='edit'&&data.tabs.length>1){var del=document.createElement('button');del.className='x';del.style.cssText='color:var(--dn);font-size:14px';del.textContent='حذف';var arm=false;
      del.onclick=function(){if(!arm){arm=true;del.textContent='مطمئنی؟ دوباره بزن';return}
        data.tabs=data.tabs.filter(function(x){return x.id!==data.cur});setCur(data.tabs[0].id)};e.appendChild(del)}
    setTimeout(function(){inp.focus()},0)}}
function renderAll(){renderTabs();render()}
function fmt(n){return Number(n).toLocaleString('fa-IR')}
function toEn(s){return s.replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[,٬،\s]/g,'')}
var MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var pf=new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});
function jparts(d){var o={};pf.formatToParts(d).forEach(function(p){o[p.type]=p.value});return {y:+o.year,m:+o.month,d:+o.day}}
function fromJalali(jy,jm,jd,old){var t=new Date(old||Date.now());var h=t.getHours(),mi=t.getMinutes(),se=t.getSeconds();
  for(var dd=jd;dd>=Math.min(jd,28);dd--){var g=new Date(jy+621,2,1,12);
    for(var k=0;k<400;k++){var q=jparts(g);if(q.y===jy&&q.m===jm&&q.d===dd){g.setHours(h,mi,se,0);return g.getTime()}g.setDate(g.getDate()+1)}}
  return old||Date.now()}
function fmtDT(t){var d=new Date(t);return d.toLocaleDateString('fa-IR')+' – '+d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}
function sel(a,b,v,lab){var e=document.createElement('select');e.style.cssText='font:inherit;font-size:12px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:3px;flex:1 1 0;min-width:0';
  for(var n=a;n<=b;n++){var o=document.createElement('option');o.value=n;o.textContent=lab(n);if(n===v)o.selected=true;e.appendChild(o)}
  e.onclick=function(ev){ev.stopPropagation()};return e}
var WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function pd(n){return String(n).replace(/\d/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'[c]})}
function wheel(){var R=44,w=document.createElement('div'),cur=0,tm;w.className='wh';
  function n(){return w.children.length}
  function get(){return Math.max(0,Math.min(n()-1,Math.round(w.scrollTop/R)))}
  function paint(){var c=get();for(var i=0;i<n();i++){var s=w.children[i];s.style.opacity=i===c?1:(Math.abs(i-c)===1?.4:.15);s.style.fontWeight=i===c?600:400}}
  w.get=get;w.onchg=function(){};
  w.set=function(arr,i){w.innerHTML='';arr.forEach(function(t){var d=document.createElement('div');d.className='wi';d.textContent=t;w.appendChild(d)});w.scrollTop=i*R;cur=i;paint()};
  w.addEventListener('scroll',function(){paint();clearTimeout(tm);tm=setTimeout(function(){var c=get();if(c!==cur){cur=c;w.onchg()}},150)});
  return w}
function dim(y,m){if(m<=6)return 31;if(m<=11)return 30;return jparts(new Date(fromJalali(y,12,30,Date.now()))).d===30?30:29}
function openPicker(it){
  var p=jparts(new Date(it.t||Date.now())),y0=p.y-10;
  var ov=document.createElement('div');ov.className='ov';
  var bx=document.createElement('div');bx.className='bx';
  var wr=document.createElement('div');wr.className='wr';
  var hl=document.createElement('div');hl.className='hl';
  var dW=wheel(),mW=wheel(),yW=wheel();mW.style.flex='1.1 1 0';
  [dW,mW,yW].forEach(function(x){wr.appendChild(x)});wr.appendChild(hl);
  var bt=document.createElement('div');bt.className='bt';
  var ok=document.createElement('button');ok.textContent='ثبت';
  var cn=document.createElement('button');cn.textContent='انصراف';cn.className='cn';
  bt.appendChild(ok);bt.appendChild(cn);bx.appendChild(wr);bx.appendChild(bt);ov.appendChild(bx);document.body.appendChild(ov);
  function fillDays(k){var y=y0+yW.get(),m=mW.get()+1,n=dim(y,m),f=new Date(fromJalali(y,m,1,Date.now())).getDay(),arr=[];
    for(var d=1;d<=n;d++)arr.push(pd(d)+' / '+WD[(f+d-1)%7]);dW.set(arr,Math.min(k,n-1))}
  var ys=[];for(var y=y0;y<=y0+13;y++)ys.push(pd(y));
  yW.set(ys,10);mW.set(MN,p.m-1);fillDays(p.d-1);
  mW.onchg=yW.onchg=function(){fillDays(dW.get())};
  function close(){document.body.removeChild(ov)}
  ok.onclick=function(){it.t=fromJalali(y0+yW.get(),mW.get()+1,dW.get()+1,it.t||Date.now());save();close();render()};
  cn.onclick=close;ov.onclick=function(e){if(e.target===ov)close()}}
function row(it,isDone){
  var tr=document.createElement('tr');if(isDone)tr.className='done';
  var j=document.createElement('td');j.className='j';
  j.appendChild(document.createTextNode(it.job));
  var s=document.createElement('div');s.style.cssText='font-size:11px;color:var(--mut);margin-top:3px;cursor:pointer';
  function showDate(){s.onclick=function(){openPicker(it)};
    s.textContent=it.t?fmtDT(it.t)+' ✎':'+ افزودن تاریخ'}
  function editDate(){s.onclick=null;s.innerHTML='';
    var p=jparts(new Date(it.t||Date.now()));
    var dS=sel(1,31,p.d,function(n){return fmt(n)}),mS=sel(1,12,p.m,function(n){return MN[n-1]}),
        yS=sel(p.y-6,p.y+2,p.y,function(n){return String(n).replace(/\d/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'[c]})});
    var ok=document.createElement('button');ok.textContent='ثبت';ok.style.cssText='padding:4px 10px;font-size:12px';
    ok.onclick=function(e){e.stopPropagation();it.t=fromJalali(+yS.value,+mS.value,+dS.value,it.t);save();render()};
    var w=document.createElement('div');w.style.cssText='display:flex;flex-wrap:nowrap;gap:4px;align-items:center';mS.style.flex='1.8 1 0';ok.style.flex='none';
    [dS,mS,yS,ok].forEach(function(x){w.appendChild(x)});s.appendChild(w)}
  showDate();j.appendChild(s);
  var c=document.createElement('td');c.className='c';
  function costInput(f){var i=document.createElement('input');i.placeholder='هزینه؟';i.inputMode='decimal';i.style.width='88px';i.style.padding='6px';
    function commit(){var v=parseFloat(toEn(i.value));if(isNaN(v)){if(it.cost!=null)showCost();return}it.cost=v;save();render()}
    i.onkeydown=function(e){if(e.key==='Enter')commit()};i.onblur=commit;if(f)setTimeout(function(){i.focus()},0);return i}
  function showCost(){c.innerHTML='';
    if(it.cost==null){c.appendChild(costInput())}
    else{c.textContent=fmt(it.cost);if(!isDone){c.style.cursor='pointer';c.onclick=function(){c.onclick=null;c.innerHTML='';c.appendChild(costInput(true))}}}}
  showCost();
  var k=document.createElement('td');k.className='k';
  var cb=document.createElement('input');cb.type='checkbox';cb.checked=isDone;
  cb.onchange=function(){it.done=cb.checked;save();render()};
  k.appendChild(cb);
  tr.appendChild(j);tr.appendChild(c);tr.appendChild(k);
  if(isDone){var d=document.createElement('td');d.className='k';
    var x=document.createElement('button');x.className='x';x.textContent='×';
    x.onclick=function(){items.splice(items.indexOf(it),1);save();render()};
    d.appendChild(x);tr.appendChild(d)}
  return tr}
function render(){
  var o=document.getElementById('open'),d=document.getElementById('done');
  o.innerHTML='';d.innerHTML='';var to=0,td=0,no=0,nd=0;
  items.slice().sort(function(a,b){return (b.t||0)-(a.t||0)}).forEach(function(it){
    if(it.done){d.appendChild(row(it,true));td+=it.cost||0;nd++}
    else{o.appendChild(row(it,false));to+=it.cost||0;no++}});
  if(!no)o.innerHTML='<tr><td colspan="3" class="empty">موردی نیست</td></tr>';
  if(!nd)d.innerHTML='<tr><td class="empty">هنوز چیزی تسویه نشده</td></tr>';
  document.getElementById('tOpen').textContent=fmt(to);
  document.getElementById('tDone').textContent=fmt(td)}
function add(){
  var j=document.getElementById('job'),c=document.getElementById('cost');
  var job=j.value.trim(),cost=parseFloat(toEn(c.value));
  if(!job)return;
  items.unshift({job:job,cost:isNaN(cost)?null:cost,done:false,t:Date.now()});save();render();
  j.value='';c.value='';j.focus()}
document.getElementById('addb').onclick=add;
document.getElementById('cost').addEventListener('keydown',function(e){if(e.key==='Enter')add()});
(function(){for(var i=0;i<16;i++){var e=document.createElement('span');e.className='em';e.style.left=(8+Math.random()*84)+'%';e.style.setProperty('--dx',(Math.random()*80-40)+'px');e.style.animationDuration=(7+Math.random()*8)+'s';e.style.animationDelay=(-Math.random()*12)+'s';var s=2+Math.random()*3;e.style.width=e.style.height=s+'px';document.body.appendChild(e)}})();
renderAll();
</script>
